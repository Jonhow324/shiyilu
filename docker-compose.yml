services:
  nav:
    image: ${NAV_IMAGE:-ghcr.io/jonhow/shiyilu:latest}
    ports:
      - "21785:3000"
    environment:
      NAV_TOKEN: ${NAV_TOKEN:?set NAV_TOKEN in .env}
      NAV_DB_PATH: /data/nav.db
      NAV_ARCHIVE_DIR: /data
    volumes:
      - nav-data:/data
    restart: unless-stopped

volumes:
  nav-data:
